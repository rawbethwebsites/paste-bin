<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PasteBox raw</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      background: #0b0c10;
      color: #e5e7eb;
      font-family: "SFMono-Regular", ui-monospace, SFMono, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      padding: 12px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .error { color: #f87171; }
  </style>
</head>
<body>
  <pre id="out"></pre>
  <div id="error" class="error"></div>
  <script>
    const out = document.getElementById('out');
    const errorBox = document.getElementById('error');

    const base64urlDecodeToBytes = (b64) => {
      const normalized = b64.replace(/-/g, '+').replace(/_/g, '/');
      const padded = normalized + '='.repeat((4 - (normalized.length % 4)) % 4);
      const binary = atob(padded);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      return bytes;
    };

    const importKey = async (keyB64) => {
      const raw = base64urlDecodeToBytes(keyB64);
      return crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
    };

    const decrypt = async ({ keyB64, iv, cipher }) => {
      const key = await importKey(keyB64);
      const ivBytes = base64urlDecodeToBytes(iv);
      const cipherBytes = base64urlDecodeToBytes(cipher);
      const plainBuf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: ivBytes }, key, cipherBytes);
      return new TextDecoder().decode(plainBuf);
    };

    const fetchRemote = async (id) => {
      const res = await fetch(`/api/paste/${id}`);
      if (!res.ok) throw new Error('Fetch failed');
      return res.json();
    };

    const render = async () => {
      const params = new URLSearchParams(location.hash.slice(1));
      const keyB64 = params.get('k');
      const iv = params.get('i');
      const cipher = params.get('c');
      const id = params.get('id');
      if (!keyB64) {
        errorBox.textContent = 'No paste in URL.';
        return;
      }
      try {
        if (id) {
          const data = await fetchRemote(id);
          if (!data.cipher || !data.iv) throw new Error('Missing cipher');
          out.textContent = await decrypt({ keyB64, iv: data.iv, cipher: data.cipher });
        } else if (iv && cipher) {
          out.textContent = await decrypt({ keyB64, iv, cipher });
        } else {
          errorBox.textContent = 'No paste in URL.';
        }
      } catch (e) {
        errorBox.textContent = 'Failed to decrypt paste.';
      }
    };

    window.addEventListener('hashchange', render);
    render();
  </script>
</body>
</html>
